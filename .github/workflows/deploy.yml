name: Build & Deploy

# 推送到 main 或手动触发：
#   前端: CI 构建产物 scp 到 nginx 静态目录
#   后端: CI 只负责推送部署脚本到服务器并触发执行（服务器自行拉取代码、构建、pm2 重启）
# 仓库地址: https://github.com/zhuqingzhi/monorepo-three
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== 构建（前端产物 + 全仓校验） ==========
  build:
    name: 构建前端 & 校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint 检查
        run: pnpm lint

      # 后端构建仅在 CI 做编译校验，产物不上传——服务器部署脚本会自行拉代码构建
      - name: 构建所有子包（含后端编译校验）
        run: pnpm build

      - name: 上传前端产物 (apps/web/dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # ========== 部署到腾讯云 ==========
  deploy:
    name: 部署到腾讯云
    runs-on: ubuntu-latest
    needs: build
    env:
      # 前端 nginx 静态目录 / 后端部署目录（代码 + 日志）
      WEB_DIR: /home/nginx/html/monorepo-three/web
      APP_DIR: /home/nginx/html/server
    steps:
      - name: 检出代码（获取部署脚本）
        uses: actions/checkout@v4

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: staging/web

      - name: 整理前端部署目录
        run: |
          mkdir -p release/web
          cp -r staging/web/. release/web/
          ls -R release

      - name: 清理远程目录
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.WEB_DIR }} ${{ env.APP_DIR }}
            rm -rf ${{ env.WEB_DIR }}/*
            # 注意：不清空 APP_DIR，保留服务器上的 repo/、config.production.yml、logs

      - name: 上传前端到 nginx 静态目录
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # tar 内路径为 release/web/xxx，需剥掉 2 层（release/ + web/）才能直接落进 WEB_DIR，
          # 只剥 1 层会多出一级目录（/web/web）
          source: 'release/web/*'
          target: ${{ env.WEB_DIR }}
          strip_components: 2
          overwrite: true

      - name: 推送后端部署脚本到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # tar 内路径为 scripts/deploy-server.sh，剥 1 层 -> deploy-server.sh 落进 APP_DIR
          source: 'scripts/deploy-server.sh'
          target: ${{ env.APP_DIR }}
          strip_components: 1
          overwrite: true

      - name: 触发服务器拉取代码并重启后端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            mkdir -p ${{ env.APP_DIR }}/logs
            # 上传自检：脚本不在说明 scp 步骤未生效，直接失败并列出目录内容便于排查
            if [ ! -f ${{ env.APP_DIR }}/deploy-server.sh ]; then
              echo "ERROR: ${{ env.APP_DIR }}/deploy-server.sh 不存在，上一步 scp 上传未生效。当前目录内容："
              ls -la ${{ env.APP_DIR }} 2>/dev/null || true
              exit 1
            fi
            bash ${{ env.APP_DIR }}/deploy-server.sh 2>&1 | tee -a ${{ env.APP_DIR }}/logs/deploy.log
            echo "=== ${{ env.APP_DIR }} 内容 ==="
            ls -la ${{ env.APP_DIR }}
            # tee 管道会吞掉脚本退出码，这里用健康检查兜底：后端没起来就让本步骤变红
            if curl -sf http://127.0.0.1:1024/health >/dev/null 2>&1; then
              echo "health check: OK"
            else
              echo "health check: FAILED（后端未在 1024 端口正常响应，查看上方脚本日志定位原因）"
              exit 1
            fi

  # ========== QQ 邮箱流水线通知 ==========
  notify:
    name: QQ 邮箱流水线通知
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: 发送邮件
        uses: dawidd6/action-send-mail@v3
        with:
          # QQ 邮箱 SMTP（如使用其他邮箱改这里）
          server_address: smtp.qq.com
          server_port: 465
          # TODO: <== 在仓库 Settings -> Secrets and variables -> Actions 中填入：
          #   QQ_MAIL_ACCOUNT : 发件 QQ 邮箱，例如 xxxxx@qq.com
          #   QQ_MAIL_AUTH    : QQ 邮箱 SMTP 授权码（设置 -> 账户 -> 开启 SMTP 服务后获取）
          #   QQ_MAIL_TO      : 收件邮箱（可与发件邮箱相同）
          username: ${{ secrets.QQ_MAIL_ACCOUNT }}
          password: ${{ secrets.QQ_MAIL_AUTH }}
          subject: '【monorepo-three】构建 ${{ needs.build.result }} / 部署 ${{ needs.deploy.result }}'
          to: ${{ secrets.QQ_MAIL_TO }}
          from: ${{ secrets.QQ_MAIL_ACCOUNT }}
          body: |
            仓库: ${{ github.repository }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.sha }}
            触发人: ${{ github.actor }}
            构建结果: ${{ needs.build.result }}
            部署结果: ${{ needs.deploy.result }}（后端由服务器拉取代码自行部署，失败时服务器脚本也会单独发邮件）
            运行详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
